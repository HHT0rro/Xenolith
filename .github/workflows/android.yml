name: android

# Android arm64/x86_64 ELF .so packing — structural layer only (design
# .apk-compat/xenolith/design.md §2.11): cross-build, pack, inspect and
# llvm-readelf assertions. No emulator: hosted runners have no KVM and
# bionic binaries cannot execute on the Ubuntu host. OS-load and functional
# gates live in the local android-e2e checklist (SUPPORT.md records that
# split honestly).
on:
  push:
  pull_request:

jobs:
  android-structural:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned NDK (r27c)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build CLI with both cores
        run: cargo build -p xenolith-cli --release
      - name: Unit tests (formats/pack cover the aarch64 matrix)
        run: cargo test -p xenolith-formats -p xenolith-protocol -p xenolith-pack --lib
      - name: Assert Android input refusals and packed ELF structure
        env:
          NDK: ${{ env.ANDROID_NDK_HOME }}
          CLI: target/release/xenolith
        run: |
          set -eu
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p target/android-ci
          cat > target/android-ci/victim.c <<'EOF'
          static volatile int xl_gate;
          __attribute__((constructor)) static void xl_boot_gate(void) { xl_gate = 1; }
          int hello_add(int a, int b) { return a + b; }
          const char *hello_string(void) { return "xenolith-android-ci"; }
          #if RX_NOPS > 0
          #define STR_INNER(x) #x
          #define STR(x) STR_INNER(x)
          void fixture_padding(void) {
              __asm__ volatile(".rept " STR(RX_NOPS) "\n\tnop\n\t.endr");
          }
          #endif
          EOF
          expect_refusal() {
            local input="$1" output="$2" reason="$3"
            if "$CLI" pack "$input" -o "$output" --json > "$output.stdout" 2> "$output.stderr"; then
              echo "Unexpected pack success for $input" >&2
              return 1
            fi
            grep -F "$reason" "$output.stderr" || { cat "$output.stderr" >&2; return 1; }
            test ! -e "$output"
            test ! -s "$output.stdout"
          }
          for abi_page in aarch64:4096 aarch64:16384 x86_64:4096 x86_64:16384; do
            abi=${abi_page%%:*}; page=${abi_page##*:}
            tgt=$([ "$abi" = aarch64 ] && echo aarch64-linux-android24 || echo x86_64-linux-android24)
            # The 16 KiB case has over 4 KiB of text and must still be refused.
            small_nops=0
            if [ "$page" -eq 16384 ]; then
              # Keep the executable segment between 4 KiB and 16 KiB on both ABIs.
              if [ "$abi" = aarch64 ]; then small_nops=2048; else small_nops=8192; fi
            fi
            small=target/android-ci/libsmall-$abi-$page.so
            "$CLANG/clang" --target=$tgt -fPIC -shared -O1 -Wl,-z,max-page-size=$page \
              -DRX_NOPS=$small_nops -o "$small" target/android-ci/victim.c
            expect_refusal "$small" "target/android-ci/refused-small-$abi-$page.so" \
              "smaller than the derived page size of $page bytes"

            # The larger input exercises the existing structural assertions.
            "$CLANG/clang" --target=$tgt -fPIC -shared -O1 -Wl,-z,max-page-size=$page \
              -DRX_NOPS=32768 -o target/android-ci/libvictim-$abi-$page.so target/android-ci/victim.c
            no_phdr=target/android-ci/libno-phdr-$abi-$page.so
            python3 - "target/android-ci/libvictim-$abi-$page.so" "$no_phdr" <<'EOF'
          import struct, sys
          from pathlib import Path

          data = bytearray(Path(sys.argv[1]).read_bytes())
          phoff, = struct.unpack_from("<Q", data, 32)
          entsize, count = struct.unpack_from("<HH", data, 54)
          phdrs = [phoff + i * entsize for i in range(count)]
          matches = [off for off in phdrs if struct.unpack_from("<I", data, off)[0] == 6]
          assert len(matches) == 1, "expected one PT_PHDR in the original fixture"
          struct.pack_into("<I", data, matches[0], 0)  # PT_PHDR -> PT_NULL
          Path(sys.argv[2]).write_bytes(data)
          EOF
            expect_refusal "$no_phdr" "target/android-ci/refused-no-phdr-$abi-$page.so" \
              "Android shared object is missing PT_PHDR"
            if [ "$abi" = x86_64 ] && [ "$page" -eq 16384 ]; then
              expect_refusal "target/android-ci/libvictim-$abi-$page.so" \
                "target/android-ci/refused-runtime-$abi-$page.so" \
                "Android x86_64 shared objects with 16 KiB pages are unsupported"
              continue
            fi
            "$CLI" pack target/android-ci/libvictim-$abi-$page.so -o target/android-ci/out-$abi-$page.xl.so
            "$CLI" inspect target/android-ci/out-$abi-$page.xl.so --json > target/android-ci/inspect-$abi-$page.json
            python3 - "$abi" "$page" <<'EOF'
          import json, struct, sys
          abi, page = sys.argv[1], int(sys.argv[2])
          info = json.load(open(f"target/android-ci/inspect-{abi}-{page}.json"))
          assert info["packed"] is True, info
          assert info["machine"] == abi, info
          data = open(f"target/android-ci/out-{abi}-{page}.xl.so", "rb").read()
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          loads = []
          for i in range(phnum):
              o = phoff + i * 56
              if struct.unpack_from("<I", data, o)[0] == 1:
                  off, va = struct.unpack_from("<QQ", data, o + 8)
                  fsz = struct.unpack_from("<Q", data, o + 32)[0]
                  al = struct.unpack_from("<Q", data, o + 48)[0]
                  flags = struct.unpack_from("<I", data, o + 4)[0]
                  loads.append((off, va, fsz, al, flags))
          last = loads[-1]
          assert last[3] == page, f"appended LOAD align {last[3]} != {page}"
          assert last[4] & 1, "appended LOAD must be executable"
          assert (last[1] - last[0]) % last[3] == 0, "PT_LOAD congruence broken"
          assert phoff >= page, "e_phoff must point at the tail table"
          print(f"{abi}/{page} bytes: structural assertions OK")
          EOF
          done
      - name: llvm-readelf deep assertions (C-1..C-4)
        env:
          NDK: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -eu
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          OUT=target/android-ci/out-aarch64-4096.xl.so
          IN=target/android-ci/libvictim-aarch64-4096.so
          # C-1: machine + relocated phdr table
          "$RE" -hW "$OUT" | grep -q "Machine:.*AArch64"
          # C-3: DT_INIT absent, INIT_ARRAY kept
          ! "$RE" -dW "$OUT" | grep -q "(INIT) "
          "$RE" -dW "$OUT" | grep -q "INIT_ARRAY"
          # C-2: appended R+X LOAD exists; no W+X LOAD
          "$RE" -lW "$OUT" | grep -qE "LOAD.*R E"
          ! "$RE" -lW "$OUT" | grep -qE "LOAD.*RWE"
          # C-4: the INIT_ARRAY[0] redirect — the RELATIVE whose r_offset
          # equals DT_INIT_ARRAY — has its addend in the appended LOAD.
          # Select by offset, not head -1: since the vm-hook relocation
          # preservation work the table also carries preserved input
          # RELATIVEs, so the first row is no longer the redirect.
          "$RE" -dW "$OUT" > target/android-ci/dyn.txt
          "$RE" -rW "$OUT" > target/android-ci/rel.txt
          python3 - <<'EOF'
          import re, struct
          OUT = "target/android-ci/out-aarch64-4096.xl.so"
          dyn = open("target/android-ci/dyn.txt").read()
          rel = open("target/android-ci/rel.txt").read()
          ia = int(re.search(r"\(INIT_ARRAY\)\s+(\S+)", dyn).group(1), 16)
          addend = None
          for line in rel.splitlines():
            m = re.match(r"([0-9a-fA-F]+)\s+\S+\s+R_AARCH64_RELATIVE\s+(\S+)", line)
            if m and int(m.group(1), 16) == ia:
              addend = int(m.group(2), 16)
              break
          assert addend is not None, f"no R_AARCH64_RELATIVE at DT_INIT_ARRAY {ia:#x}"
          data = open(OUT, "rb").read()
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          o = phoff + (phnum - 2) * 56
          va = struct.unpack_from("<Q", data, o + 16)[0]
          msz = struct.unpack_from("<Q", data, o + 40)[0]
          assert va <= addend < va + msz, f"redirect addend {addend:#x} outside appended LOAD [{va:#x},{va+msz:#x})"
          print("INIT_ARRAY[0] redirect addend lands in the appended LOAD: OK")
          EOF
      - name: Inspect tampered ELF (structural check)
        run: |
          set -eu
          python3 - <<'EOF'
          data = bytearray(open("target/android-ci/out-aarch64-4096.xl.so", "rb").read())
          i = data.find(b"XLV2")
          data[i + 100] ^= 1
          open("target/android-ci/tampered.xl.so", "wb").write(bytes(data))
          EOF
          # The structural layer only asserts the tampered artifact still parses
          # as an ELF; AEAD rejection happens inside the injected core at load
          # time and is exercised by the local android-e2e gates.
          target/release/xenolith inspect target/android-ci/tampered.xl.so --json | grep -q '"format": "elf64-dyn"'
