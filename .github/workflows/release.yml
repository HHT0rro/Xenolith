name: release

# TASK-039: release bundles with SBOM, artifact hashes, provenance, and gate
# evidence. No code signing exists (decision D2, 2026-09-08): integrity is
# the manifest sha256 list. Manual dispatch only — never on push.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Release label (e.g. v0.1.0-g8)"
        required: true
        type: string
      allow_budget_fail:
        description: "Publish an engineering build despite unmet TASK-038 budgets (recorded in the manifest)"
        required: false
        default: false
        type: boolean

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned NDK (r27c) for the aarch64 core
        # Release CLIs must embed the NDK-built aarch64 core so arm64 packing
        # works out of the box (same pin as android.yml). Without it the CLI
        # refuses arm64 inputs with a named error and the Android release
        # claim would be false.
        shell: bash
        # No pipefail on purpose: `yes | sdkmanager` ends with SIGPIPE on
        # `yes` once sdkmanager exits; the sdkmanager status must decide.
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            export ANDROID_HOME="$LOCALAPPDATA/Android/Sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          else
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build workspace and samples
        run: |
          cargo build -p xenolith-cli --release
          cargo build -p hello-dll -p license-toy -p hello-exe -p eh-dll -p jni-host -p jni-rust --release
      - name: Regression
        env:
          XL_SKIP_WSL_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        # With ANDROID_NDK_HOME set the aarch64 pack/vm tests run for real
        # here instead of skipping — the release regression covers Android.
        run: cargo test --workspace --exclude xenolith-runtime
      - name: Assemble release bundle
        run: >
          ./target/release/xenolith release
          --out dist
          --label "${{ inputs.label }}-${{ runner.os }}"
          ${{ inputs.allow_budget_fail && '--allow-budget-fail' || '' }}
      - name: Manifest digest
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum dist/manifest.json
          else
            powershell -Command "(Get-FileHash dist/manifest.json -Algorithm SHA256).Hash"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xenolith-${{ inputs.label }}-${{ runner.os }}
          path: dist/
          if-no-files-found: error
