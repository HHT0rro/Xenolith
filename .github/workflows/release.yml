name: release

# TASK-039: release bundles with SBOM, artifact hashes, provenance, and gate
# evidence. No code signing exists (decision D2, 2026-09-08): integrity is
# the manifest sha256 list. Manual dispatch only — never on push.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Release label (e.g. v0.1.0-g8)"
        required: true
        type: string
      allow_budget_fail:
        description: "Publish an engineering build despite unmet TASK-038 budgets (recorded in the manifest)"
        required: false
        default: false
        type: boolean

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned NDK (r27c) for the aarch64 core
        # Release CLIs must embed the NDK-built aarch64 core so arm64 packing
        # works out of the box (same pin as android.yml). Both legs install
        # cmdline-tools themselves: ubuntu-latest no longer ships an Android
        # SDK, and windows-latest never did. `shell: bash` on Actions implies
        # pipefail — `yes | sdkmanager` always ends in SIGPIPE on `yes`, so it
        # is disabled here; the sdkmanager status and the dir assert decide.
        shell: bash
        run: |
          set -eu
          set +o pipefail
          case "$RUNNER_OS" in
            Windows) CT=win; BAT=.bat ;;
            *)       CT=linux; BAT= ;;
          esac
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-${CT}-11076708_latest.zip"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager${BAT}"
          yes | "$SDKMGR" --licenses > /dev/null
          yes | "$SDKMGR" "ndk;27.2.12479018" > /dev/null
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build workspace and samples
        run: |
          cargo build -p xenolith-cli --release
          cargo build -p hello-dll -p license-toy -p hello-exe -p eh-dll -p jni-host -p jni-rust --release
      - name: Regression
        env:
          XL_SKIP_WSL_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        # With ANDROID_NDK_HOME set the aarch64 pack/vm tests run for real
        # here instead of skipping — the release regression covers Android.
        run: cargo test --workspace --exclude xenolith-runtime
      - name: Assemble release bundle
        id: assemble
        shell: bash
        env:
          RELEASE_LABEL: ${{ inputs.label }}
          ALLOW_BUDGET_FAIL: ${{ inputs.allow_budget_fail }}
        run: |
          set -eu
          cli=./target/release/xenolith
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cli+=.exe
            runner_temp=$(cygpath -u "$runner_temp")
          fi
          work=$(mktemp -d "$runner_temp/xenolith-release.XXXXXXXX")
          args=(release --out "$work/dist" --label="$RELEASE_LABEL-$RUNNER_OS")
          if [[ "$ALLOW_BUDGET_FAIL" == true ]]; then
            args+=(--allow-budget-fail)
          fi
          "$cli" "${args[@]}"
          sha256sum "$work/dist/manifest.json"
          bundle="$work/dist"
          if [[ "$RUNNER_OS" == Windows ]]; then
            bundle=$(cygpath -m "$bundle")
          fi
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        id: windows_archive
        shell: pwsh
        env:
          RELEASE_BUNDLE: ${{ steps.assemble.outputs.bundle }}
        run: |
          $archive = Join-Path (Split-Path -Parent $env:RELEASE_BUNDLE) 'xenolith-Windows.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($env:RELEASE_BUNDLE, $archive)
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        id: linux_archive
        shell: bash
        env:
          RELEASE_BUNDLE: ${{ steps.assemble.outputs.bundle }}
        run: |
          set -eu
          # upload-artifact normalizes permissions. The tar keeps the Unix CLI executable.
          archive="$RELEASE_BUNDLE/../xenolith-Linux.tar.gz"
          tar -czf "$archive" -C "$RELEASE_BUNDLE/.." dist
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: xenolith-${{ inputs.label }}-${{ runner.os }}
          path: ${{ steps.windows_archive.outputs.archive || steps.linux_archive.outputs.archive }}
          if-no-files-found: error
